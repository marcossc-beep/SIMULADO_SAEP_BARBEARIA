<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia - Login</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main>
        <h1>Barbearia - Login</h1>

        <form id="formLogin" onsubmit="fazerLogin(event)">
            <input type="email" id="email" placeholder="E-mail"><br>
            <input type="password" id="senha" placeholder="Senha"><br>
            <button type="submit">Entrar</button>
            <!-- Mensagem de falha na autenticação aparece aqui -->
            <p id="mensagem" class="erro"></p>
        </form>
    </main>

    <script src="sessao.js"></script>
    <script>
        // Se já estiver logado e a sessão não expirou, vai direto para a principal
        if (sessaoValida()) {
            window.location.href = 'principal.html'
        }

        async function fazerLogin(event) {
            event.preventDefault()

            const email = document.getElementById('email').value
            const senha = document.getElementById('senha').value
            const mensagem = document.getElementById('mensagem')

            // Validação no frontend
            if (!email || !senha) {
                mensagem.textContent = 'Preencha e-mail e senha!'
                return
            }

            const resposta = await fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            })

            const dados = await resposta.json()

            // Validação vinda do backend (usuário ou senha inválidos)
            if (!resposta.ok) {
                mensagem.textContent = dados.message
                return
            }

            localStorage.setItem('token', dados.token)
            localStorage.setItem('expira', dados.expira)
            localStorage.setItem('usuario', JSON.stringify(dados.usuario))

            window.location.href = 'principal.html'
        }
    </script>
</body>
</html>
